# .specs/config.yaml — project-wide spec workflow config (free-form, agent-interpreted)
#
# This file is read at the start of every spec workflow action (brainstorm,
# spec init, status, validate, task check, implementation). Edits take effect
# on the next action. The schema is intentionally free-form: any keys you add
# are surfaced to the spec agent as project context.

project:
  goal: "Transparent two-board USB HID keyboard bridge (KBD host + TGT device over SPI) that presents any USB keyboard to a target as a vanilla USB 1.1 boot keyboard."
  tech_stack:
    - "C / ESP-IDF 6.x (firmware)"
    - "PlatformIO (build/flash/test)"
    - "ESP32-S3 (Waveshare S3-Zero on the bench; custom PCB in progress)"
    - "no datastore"

principles:
  tdd: false # write tests first when true
  no_comments: false # omit code comments when true
  constitution: "Cheapest commonly-available parts that meet requirements; each board independently developable/testable; boring well-documented stacks; artifacts proportional to the problem."

hooks:
  after_task:
    - command: "make test"
      auto: false # host bridge_proto unit tests (native); firmware/PCB tasks are hardware-verified

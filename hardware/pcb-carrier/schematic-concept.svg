<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
  <text x="620" y="34" text-anchor="middle" font-size="22" font-weight="bold">kbdrelay carrier — concept schematic</text>
  <text x="620" y="56" text-anchor="middle" font-size="13" fill="#666">Conceptual only (not KiCad-exact). Single-sided, all through-hole discretes. Two socketed S3-Zero modules.</text>

  <!-- ===================== POWER INPUT + PROTECTION ===================== -->
  <text x="40" y="96" font-size="14" font-weight="bold" fill="#0a5">POWER PATH (KBD only)</text>

  <!-- J_PWR 2-pin header -->
  <rect x="40" y="110" width="70" height="70" fill="#eef" stroke="#333"/>
  <text x="75" y="104" text-anchor="middle" font-size="12" font-weight="bold">J_PWR</text>
  <circle cx="110" cy="130" r="3" fill="#333"/><text x="60" y="134" font-size="12">5V</text>
  <circle cx="110" cy="165" r="3" fill="#333"/><text x="55" y="169" font-size="12">GND</text>

  <!-- wire 5V to P-FET -->
  <line x1="110" y1="130" x2="160" y2="130" stroke="#333" stroke-width="2"/>

  <!-- Q1 P-FET ideal diode -->
  <rect x="160" y="105" width="105" height="60" fill="#ffe" stroke="#333"/>
  <text x="212" y="128" text-anchor="middle" font-size="11" font-weight="bold">Q1 P-FET</text>
  <text x="212" y="143" text-anchor="middle" font-size="10">ideal-diode</text>
  <text x="212" y="156" text-anchor="middle" font-size="10">(rev-polarity)</text>
  <text x="158" y="102" font-size="9" fill="#a00">D</text>
  <text x="258" y="102" font-size="9" fill="#a00">S</text>
  <!-- gate to 100k to GND -->
  <line x1="212" y1="165" x2="212" y2="200" stroke="#333" stroke-width="1.5"/>
  <rect x="192" y="200" width="40" height="16" fill="#fff" stroke="#333"/>
  <text x="212" y="212" text-anchor="middle" font-size="9">100k</text>
  <line x1="212" y1="216" x2="212" y2="250" stroke="#333" stroke-width="1.5"/>

  <!-- node A -->
  <line x1="265" y1="130" x2="330" y2="130" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="130" r="3" fill="#333"/>

  <!-- bulk caps down to GND -->
  <line x1="300" y1="130" x2="300" y2="175" stroke="#333" stroke-width="1.5"/>
  <line x1="288" y1="175" x2="312" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="290" y1="182" x2="310" y2="182" stroke="#333" stroke-width="2"/>
  <text x="318" y="182" font-size="10">470µF</text>
  <line x1="300" y1="182" x2="300" y2="250" stroke="#333" stroke-width="1.5"/>
  <!-- 0.1uF near node -->
  <line x1="340" y1="130" x2="340" y2="175" stroke="#333" stroke-width="1.5"/>
  <line x1="328" y1="175" x2="352" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="330" y1="182" x2="350" y2="182" stroke="#333" stroke-width="2"/>
  <text x="358" y="182" font-size="10">0.1µF</text>
  <line x1="340" y1="182" x2="340" y2="250" stroke="#333" stroke-width="1.5"/>
  <line x1="330" y1="130" x2="410" y2="130" stroke="#333" stroke-width="2"/>

  <!-- polyfuse -->
  <rect x="410" y="112" width="90" height="36" fill="#fee" stroke="#333"/>
  <text x="455" y="130" text-anchor="middle" font-size="10" font-weight="bold">F1 polyfuse</text>
  <text x="455" y="143" text-anchor="middle" font-size="9">PPTC ~0.5A</text>
  <line x1="500" y1="130" x2="560" y2="130" stroke="#333" stroke-width="2"/>
  <circle cx="545" cy="130" r="3" fill="#333"/>
  <text x="520" y="122" font-size="11" font-weight="bold" fill="#0a5">+5V_KBD</text>

  <!-- power-good LED branch -->
  <line x1="545" y1="130" x2="545" y2="175" stroke="#333" stroke-width="1.5"/>
  <rect x="525" y="175" width="40" height="16" fill="#fff" stroke="#333"/>
  <text x="545" y="187" text-anchor="middle" font-size="9">1k</text>
  <polygon points="537,200 553,200 545,214" fill="#f80" stroke="#333"/>
  <text x="519" y="210" text-anchor="end" font-size="10">PWR</text>
  <line x1="545" y1="214" x2="545" y2="250" stroke="#333" stroke-width="1.5"/>

  <!-- 5V_KBD into KBD box -->
  <line x1="545" y1="130" x2="600" y2="130" stroke="#333" stroke-width="2"/>

  <!-- ===================== KBD MODULE ===================== -->
  <rect x="600" y="110" width="150" height="330" fill="#eaf7ea" stroke="#0a5" stroke-width="2"/>
  <text x="675" y="132" text-anchor="middle" font-size="13" font-weight="bold">KBD</text>
  <text x="675" y="148" text-anchor="middle" font-size="10">Waveshare S3-Zero</text>
  <text x="675" y="162" text-anchor="middle" font-size="9" fill="#a00">USB-C → keyboard</text>
  <text x="675" y="173" text-anchor="middle" font-size="8" fill="#a00">(USB-A→C adapter)</text>

  <!-- KBD right-edge pins -->
  <g font-size="11">
    <circle cx="600" cy="130" r="3" fill="#0a5"/><text x="610" y="134">5V</text>
    <circle cx="750" cy="200" r="3" fill="#333"/><text x="705" y="204">GP4</text>
    <circle cx="750" cy="225" r="3" fill="#333"/><text x="705" y="229">GP5</text>
    <circle cx="750" cy="250" r="3" fill="#333"/><text x="705" y="254">GP6</text>
    <circle cx="750" cy="275" r="3" fill="#333"/><text x="705" y="279">GP7</text>
    <circle cx="750" cy="300" r="3" fill="#333"/><text x="705" y="304">GP8</text>
    <circle cx="750" cy="340" r="3" fill="#c60"/><text x="700" y="344">GP9</text>
    <circle cx="750" cy="380" r="3" fill="#06c"/><text x="705" y="384">TX</text>
    <circle cx="750" cy="400" r="3" fill="#06c"/><text x="705" y="404">RX</text>
    <circle cx="620" cy="440" r="3" fill="#333"/><text x="628" y="436">GND</text>
  </g>

  <!-- ===================== SPI SERIES RESISTORS ===================== -->
  <text x="855" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a5">SPI (2.2k series)</text>
  <g font-size="10">
    <!-- 5 lines GP4..GP8 -->
    <!-- GP4 SCK -->
    <line x1="750" y1="200" x2="820" y2="200" stroke="#333"/><rect x="820" y="192" width="70" height="16" fill="#fff" stroke="#333"/><text x="855" y="204" text-anchor="middle">2.2k SCK</text><line x1="890" y1="200" x2="960" y2="200" stroke="#333"/>
    <line x1="750" y1="225" x2="820" y2="225" stroke="#333"/><rect x="820" y="217" width="70" height="16" fill="#fff" stroke="#333"/><text x="855" y="229" text-anchor="middle">2.2k MOSI</text><line x1="890" y1="225" x2="960" y2="225" stroke="#333"/>
    <line x1="750" y1="250" x2="820" y2="250" stroke="#333"/><rect x="820" y="242" width="70" height="16" fill="#fff" stroke="#333"/><text x="855" y="254" text-anchor="middle">2.2k MISO</text><line x1="890" y1="250" x2="960" y2="250" stroke="#333"/>
    <line x1="750" y1="275" x2="820" y2="275" stroke="#333"/><rect x="820" y="267" width="70" height="16" fill="#fff" stroke="#333"/><text x="855" y="279" text-anchor="middle">2.2k CS</text><line x1="890" y1="275" x2="960" y2="275" stroke="#333"/>
    <line x1="750" y1="300" x2="820" y2="300" stroke="#333"/><rect x="820" y="292" width="70" height="16" fill="#fff" stroke="#333"/><text x="855" y="304" text-anchor="middle">2.2k DR</text><line x1="890" y1="300" x2="960" y2="300" stroke="#333"/>
  </g>

  <!-- ===================== TGT MODULE ===================== -->
  <rect x="960" y="110" width="150" height="330" fill="#eaf0f7" stroke="#06c" stroke-width="2"/>
  <text x="1035" y="132" text-anchor="middle" font-size="13" font-weight="bold">TGT</text>
  <text x="1035" y="148" text-anchor="middle" font-size="10">Waveshare S3-Zero</text>
  <text x="1035" y="162" text-anchor="middle" font-size="9" fill="#a00">USB-C → target</text>
  <text x="1035" y="173" text-anchor="middle" font-size="8" fill="#a00">(powers TGT)</text>

  <g font-size="11">
    <circle cx="960" cy="200" r="3" fill="#333"/>
    <circle cx="960" cy="225" r="3" fill="#333"/>
    <circle cx="960" cy="250" r="3" fill="#333"/>
    <circle cx="960" cy="275" r="3" fill="#333"/>
    <circle cx="960" cy="300" r="3" fill="#333"/>
    <circle cx="960" cy="340" r="3" fill="#c60"/><text x="968" y="344">GP9</text>
    <circle cx="960" cy="380" r="3" fill="#06c"/><text x="968" y="384">TX</text>
    <circle cx="960" cy="400" r="3" fill="#06c"/><text x="968" y="404">RX</text>
    <circle cx="1090" cy="130" r="3" fill="#a00"/><text x="1082" y="250" text-anchor="end" fill="#a00">5V pin = NC</text>
    <circle cx="1090" cy="440" r="3" fill="#333"/><text x="1050" y="436">GND</text>
  </g>

  <!-- ===================== RESET RESERVE (GP9) ===================== -->
  <text x="855" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#c60">Reserved soft-reset (unpopulated)</text>
  <line x1="750" y1="340" x2="785" y2="340" stroke="#c60"/><rect x="785" y="332" width="34" height="16" fill="#fff" stroke="#333"/><text x="802" y="344" text-anchor="middle" font-size="9">1k</text>
  <line x1="960" y1="340" x2="925" y2="340" stroke="#c60"/><rect x="891" y="332" width="34" height="16" fill="#fff" stroke="#333"/><text x="908" y="344" text-anchor="middle" font-size="9">1k</text>
  <line x1="819" y1="340" x2="855" y2="340" stroke="#c60"/><line x1="855" y1="340" x2="891" y2="340" stroke="#c60"/>
  <circle cx="855" cy="340" r="3" fill="#c60"/>
  <line x1="855" y1="340" x2="855" y2="520" stroke="#c60" stroke-dasharray="4 3"/>
  <rect x="815" y="520" width="80" height="46" fill="#fff7ee" stroke="#c60"/>
  <text x="855" y="538" text-anchor="middle" font-size="10" font-weight="bold">J_RST</text>
  <text x="855" y="552" text-anchor="middle" font-size="9">RST_BTN / GND</text>
  <text x="855" y="580" text-anchor="middle" font-size="8" fill="#c60">(not populated in v1)</text>

  <!-- ===================== UART HEADERS ===================== -->
  <text x="470" y="500" font-size="13" font-weight="bold" fill="#06c">Debug UART (1k series, no VCC)</text>
  <!-- KBD UART -->
  <line x1="750" y1="380" x2="620" y2="380" stroke="#06c"/><rect x="560" y="372" width="34" height="16" fill="#fff" stroke="#333"/><text x="577" y="384" text-anchor="middle" font-size="9">1k</text>
  <line x1="750" y1="400" x2="620" y2="400" stroke="#06c"/><rect x="560" y="392" width="34" height="16" fill="#fff" stroke="#333"/><text x="577" y="404" text-anchor="middle" font-size="9">1k</text>
  <line x1="560" y1="380" x2="470" y2="380" stroke="#06c"/><line x1="560" y1="400" x2="470" y2="400" stroke="#06c"/>
  <rect x="400" y="360" width="70" height="70" fill="#eef5ff" stroke="#06c"/>
  <text x="435" y="352" text-anchor="middle" font-size="10" font-weight="bold">J_UART_KBD</text>
  <text x="435" y="384" text-anchor="middle" font-size="9">TX</text>
  <text x="435" y="404" text-anchor="middle" font-size="9">RX</text>
  <text x="435" y="422" text-anchor="middle" font-size="9">GND</text>

  <!-- ===================== GND RAIL ===================== -->
  <line x1="212" y1="250" x2="340" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="250" x2="300" y2="250" stroke="#333"/>
  <line x1="545" y1="250" x2="545" y2="250" stroke="#333"/>
  <line x1="120" y1="640" x2="1120" y2="640" stroke="#333" stroke-width="3"/>
  <text x="120" y="632" font-size="12" font-weight="bold">GND (common)</text>
  <!-- ties to GND rail -->
  <line x1="212" y1="250" x2="212" y2="640" stroke="#333"/>
  <line x1="300" y1="250" x2="300" y2="640" stroke="#333"/>
  <line x1="340" y1="250" x2="340" y2="640" stroke="#333"/>
  <line x1="545" y1="250" x2="545" y2="640" stroke="#333"/>
  <line x1="110" y1="165" x2="110" y2="640" stroke="#333"/>
  <line x1="620" y1="440" x2="620" y2="640" stroke="#333"/>
  <line x1="1090" y1="440" x2="1090" y2="640" stroke="#333"/>
  <line x1="855" y1="566" x2="855" y2="640" stroke="#c60" stroke-dasharray="4 3"/>
  <line x1="435" y1="430" x2="435" y2="640" stroke="#06c"/>

  <!-- ===================== NOTES / LEGEND ===================== -->
  <rect x="120" y="680" width="1000" height="180" fill="#fafafa" stroke="#ccc"/>
  <text x="135" y="702" font-size="13" font-weight="bold">Notes</text>
  <g font-size="12" fill="#333">
    <text x="135" y="724">• Power: J_PWR 5V → Q1 P-FET reverse-polarity (full 5V, no diode drop) → 470µF+0.1µF bulk → F1 polyfuse → KBD 5V pin → (KBD USB-C) → keyboard.</text>
    <text x="135" y="746">• TGT is powered ONLY by the target via its own USB-C. TGT 5V pin is NOT connected on the carrier (FR5.1 / FR5.3). Only GND + SPI cross to TGT.</text>
    <text x="135" y="768">• SPI GP4–GP8 wired straight (pin N ↔ pin N) through 2.2k series resistors — backfeed/latch-up limit + power-up-order fix (FR5.4).</text>
    <text x="135" y="790">• Reserved GP9 soft-reset: both modules → 1k each → J_RST (RST_BTN/GND), unpopulated. Future one-button reset of both (needs firmware).</text>
    <text x="135" y="812">• UART headers: TX/RX via 1k series, no VCC pin → a plugged-in USB-UART adapter can't back-power a module.</text>
    <text x="135" y="834">• Status: each module's onboard WS2812 (GPIO21). Carrier adds one PWR-good LED on +5V_KBD. All discretes through-hole; single copper layer.</text>
  </g>
</svg>

; kbdrelay — USB HID keyboard bridge
; Option A layout: one project, multiple environments.
;   kbd / tgt            -> the two real bridge firmwares (ESP32-S3-Zero)
;   mock_kbd / mock_tgt  -> SPI-peer stand-ins for standalone board testing
;   native               -> host unit tests for the shared bridge_proto lib
;
; Shared code lives in components/bridge_proto:
;   - ESP-IDF builds pick it up automatically as a component
;   - the native test env consumes it via lib_extra_dirs
;
; ESP-IDF ignores build_src_filter, so which firmware an env builds is chosen
; in src/CMakeLists.txt via -DKBDRELAY_APP=<name> (board_build.cmake_extra_args).

[platformio]
boards_dir = boards
default_envs = kbd, tgt

; --- shared base for all ESP-IDF (on-target) environments ---
[esp32_base]
platform = espressif32
board = waveshare_esp32_s3_zero
framework = espidf
monitor_speed = 115200
; S3-Zero native USB: don't let opening the monitor reset the chip.
monitor_dtr = 0
monitor_rts = 0

[env:kbd]
extends = esp32_base
board_build.cmake_extra_args = -DKBDRELAY_APP=kbd

[env:tgt]
extends = esp32_base
board_build.cmake_extra_args = -DKBDRELAY_APP=tgt

[env:mock_kbd]
extends = esp32_base
board_build.cmake_extra_args = -DKBDRELAY_APP=mock_kbd

[env:mock_tgt]
extends = esp32_base
board_build.cmake_extra_args = -DKBDRELAY_APP=mock_tgt

; --- host unit tests: runs on the Mac, no hardware (AC6, task T2) ---
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_extra_dirs = components
